<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro‘yxatdan o‘tish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .signup-container {
            max-width: 400px;
            padding: 20px;
            background-color: #fff;
            color: #000;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
        .btn-custom {
            background-color: #ff0000;
            color: #fff;
            border-radius: 8px;
            padding: 10px;
            font-weight: bold;
        }
        .btn-custom:hover {
            background-color: #cc0000;
        }
        input {
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2 class="text-center">Ro‘yxatdan o‘tish</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Foydalanuvchi nomi</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Parol</label>
                <input type="password" name="password1" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Parolni tasdiqlash</label>
                <input type="password" name="password2" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-custom w-100">Ro'yxatdan o'tish</button>
        </form>
        <p class="text-center mt-3">Allaqachon hisobingiz bormi<a href="{% url 'login' %}" class="text-danger">Kirish</a></p>
    </div>
</body>
</html>
