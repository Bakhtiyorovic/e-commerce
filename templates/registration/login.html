<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
        }
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            color: #000;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        .btn-custom {
            background-color: #ff0000;
            color: #fff;
            border: none;
        }
        .btn-custom:hover {
            background-color: #cc0000;
        }
        .forgot-password {
            text-align: center;
            margin-top: 10px;
        }
        .forgot-password a {
            color: #ff0000;
            text-decoration: none;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h2 class="text-center">Kirish</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-custom w-100">Kirish</button>
            </form>

            <!-- Parolni unutdingizmi? -->
            <p class="forgot-password">
                <a href="{% url 'password_reset' %}">Parolingizni unutdingizmi? (Iltimos o'zgartirmoqchi bo'lgan akkountizni yozib qoldiring!!!)</a>
            </p>

            <p class="text-center mt-3">
                Hisobingiz yo‘qmi? <a href="{% url 'signup' %}" class="text-danger">Ro‘yxatdan o‘tish</a>
            </p>
        </div>
    </div>
</body>
</html>
