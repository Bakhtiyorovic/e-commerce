<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parolni O'zgartirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .password-container {
            max-width: 400px;
            padding: 20px;
            background-color: #fff;
            color: #000;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
        .btn-custom {
            background-color: #ff0000;
            color: #fff;
            border-radius: 8px;
            padding: 10px;
            font-weight: bold;
        }
        .btn-custom:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>
    <div class="password-container">
        <h2 class="text-center">Parolni O'zgartirish</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-custom w-100">Parolni o'zgartirish</button>
        </form>
        <p class="text-center mt-3"><a href="{% url 'password_change_done' %}" class="text-danger">Orqaga Qaytish/a></p>
    </div>
</body>
</html>
