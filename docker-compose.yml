version: "3.9"

services:
  web:
    build: .
    container_name: ecommerce_web
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: ecommerce_db
    environment:
      POSTGRES_DB: e_commerce
      POSTGRES_USER: e_commerce_manager
      POSTGRES_PASSWORD: mirjalol0107
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
